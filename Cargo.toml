[workspace]
members = [".", "xtask"]

[package]
name = "stress-ssh-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "stress_ssh_agent"
path = "src/lib.rs"

[[bin]]
name = "stress-ssh-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rand = "0.8"
ssh-agent-client-rs = "1.1"
ssh-key = { version = "0.6", features = ["p256", "p384", "p521"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
p521 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
rsa = "0.9"
signature = "2"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
hdrhistogram = "7"
